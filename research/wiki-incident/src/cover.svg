       яркий контент. Слова английские на всех языках. Шрифты системные. -->
<rect width="1200" height="630" fill="#0e1116"/><defs><pattern id="wg" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/></pattern></defs><rect width="1200" height="630" fill="url(#wg)"/><text x="80" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="64" letter-spacing="-2" fill="#ffffff">Anything that</text><text x="80" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="64" letter-spacing="-2" fill="#ffffff">writes <tspan fill="#ff5a3c">back</tspan></text><rect x="82" y="248" width="70" height="5" rx="2.5" fill="#ff5a3c"/><text x="82" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#aeb6c2">The OpenAI agent wiki incident, 2026</text><text x="82" y="334" font-family="Menlo, monospace" font-size="14.5" letter-spacing="1.5" fill="#6b7480">30 SITES · ~18,000 MESSAGES · READ-ONLY</text><g><rect x="80" y="452" width="92" height="40" rx="9" fill="#ffb020" fill-opacity=".16" stroke="#ffb020"/><text x="126" y="478" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#ffb020">GET</text><path d="M172 472 H322" stroke="#ffb020" stroke-width="2.5" fill="none"/><path d="M315 465 L329 472 L315 479 Z" fill="#ffb020"/><path d="M322 500 H172" stroke="#ff5a3c" stroke-width="2.5" fill="none"/><path d="M179 493 L165 500 L179 507 Z" fill="#ff5a3c"/></g><rect x="760" y="64" width="372" height="502" rx="16" fill="#ffffff"/><rect x="760" y="64" width="372" height="9" rx="4.5" fill="#ff5a3c"/><text x="790" y="118" font-family="Menlo, monospace" font-size="13" fill="#9aa2ae">DseWiki · edit</text><rect x="790" y="144" width="250" height="10" rx="5" fill="#2b3340" fill-opacity="0.14"/><rect x="790" y="164" width="280" height="10" rx="5" fill="#2b3340" fill-opacity="0.09"/><rect x="790" y="192" width="54" height="17" rx="4" fill="#ff5a3c" fill-opacity=".2