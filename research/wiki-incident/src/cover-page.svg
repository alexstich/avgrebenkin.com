<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <!-- Обложка для шапки самой страницы: та же графика и те же слова, что на
       карточке раздела, только шире. Слова английские на всех тринадцати языках
       — имена собственные (OpenAI, DseWiki) и так одинаковы, а остальное решено
       держать по-английски, как у соседних исследований. -->
  <defs>
    <pattern id="gridp" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowp" cx="82%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#8b7cff" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="560" fill="#0b0c11"/>
  <rect width="1600" height="560" fill="url(#gridp)"/>
  <rect width="1600" height="560" fill="url(#glowp)"/>

  <text x="96" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="74" letter-spacing="-2.3" fill="#e9eaf0">Anything that</text>
  <text x="96" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="74" letter-spacing="-2.3" fill="#e9eaf0">writes back</text>
  <text x="98" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="23" fill="#9298a8">The OpenAI agent wiki incident, 2026</text>
  <text x="98" y="344" font-family="Menlo, monospace" font-size="14.5"
        letter-spacing="1.6" fill="#6f7484">30 SITES · ~18,000 MESSAGES · READ-ONLY</text>

  <g>
    <rect x="98" y="418" width="92" height="40" rx="8" fill="none" stroke="#6ea8fe" stroke-opacity=".7"/>
    <text x="144" y="444" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#6ea8fe">GET</text>
    <path d="M190 438 H360" fill="none" stroke="#6ea8fe" stroke-width="2"/>
    <path d="M354 432 L366 438 L354 444 Z" fill="#6ea8fe"/>
    <path d="M360 466 H190" fill="none" stroke="#f97362" stroke-width="2"/>
    <path d="M196 460 L184 466 L196 472 Z" fill="#f97362"/>
    <text x="200" y="410" font-family="Menlo, monospace" font-size="12.5" letter-spacing="1" fill="#6f7484">read a page…</text>
    <text x="200" y="494" font-family="Menlo, monospace" font-size="12.5" letter-spacing="1" fill="#b06a60">…and it kept your note</text>
  </g>

  <g>
    <rect x="1120" y="44" width="384" height="472" rx="10" fill="#12141c" stroke="#ffffff" stroke-opacity=".10"/>
    <rect x="1120" y="44" width="384" height="4" fill="#8b7cff" fill-opacity=".7"/>
    <text x="1148" y="92" font-family="Menlo, monospace" font-size="13" letter-spacing="1.4" fill="#6f7484">DseWiki · edit</text>
    <rect x="1148" y="114" width="248" height="9" rx="2" fill="#ffffff" fill-opacity=".13"/>
    <rect x="1148" y="134" width="320" height="9" rx="2" fill="#ffffff" fill-opacity=".08"/>
    <rect x="1148" y="162" width="52" height="15" rx="3" fill="#6ea8fe" fill-opacity=".22"/>
    <text x="1152" y="174" font-family="Menlo, monospace" font-size="11" fill="#6ea8fe">OpenAI…</text>
    <rect x="1148" y="186" width="300" height="9" rx="2" fill="#6ea8fe" fill-opacity=".30"/>
    <rect x="1148" y="202" width="220" height="9" rx="2" fill="#6ea8fe" fill-opacity=".18"/>
    <rect x="1148" y="230" width="312" height="9" rx="2" fill="#ffffff" fill-opacity=".08"/>
    <rect x="1148" y="250" width="264" height="9" rx="2" fill="#ffffff" fill-opacity=".08"/>
    <rect x="1148" y="278" width="60" height="15" rx="3" fill="#f97362" fill-opacity=".22"/>
    <text x="1152" y="290" font-family="Menlo, monospace" font-size="11" fill="#f97362">OAI…</text>
    <rect x="1148" y="302" width="308" height="9" rx="2" fill="#f97362" fill-opacity=".30"/>
    <rect x="1148" y="318" width="196" height="9" rx="2" fill="#f97362" fill-opacity=".18"/>
    <rect x="1148" y="346" width="280" height="9" rx="2" fill="#ffffff" fill-opacity=".08"/>
    <rect x="1148" y="374" width="44" height="15" rx="3" fill="#e0a33e" fill-opacity=".25"/>
    <text x="1152" y="386" font-family="Menlo, monospace" font-size="11" fill="#e0a33e">ZZZ</text>
    <rect x="1148" y="398" width="236" height="9" rx="2" fill="#e0a33e" fill-opacity=".26"/>
    <rect x="1148" y="426" width="320" height="9" rx="2" fill="#ffffff" fill-opacity=".08"/>
    <rect x="1148" y="446" width="188" height="9" rx="2" fill="#ffffff" fill-opacity=".08"/>
    <rect x="1148" y="474" width="292" height="9" rx="2" fill="#ffffff" fill-opacity=".08"/>
  </g>
</svg>
