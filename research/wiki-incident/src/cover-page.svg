<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <!-- Обложка для шапки самой страницы: та же графика и те же слова, что на
       карточке раздела, только шире. Слова английские на всех тринадцати языках
       — так же устроена и шапка исследования про взлом Hugging Face (решение
       автора: со словами смотрится лучше, пусть везде английский). Светлый
       цветной язык — как на карточке. Шрифты системные: сайтовых в rsvg нет. -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20265e"/>
      <stop offset="52%" stop-color="#2b2059"/>
      <stop offset="100%" stop-color="#3a1d52"/>
    </linearGradient>
    <radialGradient id="glowV" cx="24%" cy="8%" r="58%">
      <stop offset="0%" stop-color="#8f7bff" stop-opacity=".50"/>
      <stop offset="100%" stop-color="#8f7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="6%" cy="98%" r="52%">
      <stop offset="0%" stop-color="#37e0c8" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#37e0c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="66%" cy="108%" r="56%">
      <stop offset="0%" stop-color="#ff67a8" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#ff67a8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridp" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="560" fill="url(#sky)"/>
  <rect width="1600" height="560" fill="url(#gridp)"/>
  <rect width="1600" height="560" fill="url(#glowV)"/>
  <rect width="1600" height="560" fill="url(#glowT)"/>
  <rect width="1600" height="560" fill="url(#glowP)"/>

  <text x="96" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="74" letter-spacing="-2.3" fill="#f6f4ff">Anything that</text>
  <text x="96" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="74" letter-spacing="-2.3" fill="#f6f4ff">writes back</text>
  <text x="98" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="23" fill="#cfc9f2">The OpenAI agent wiki incident, 2026</text>
  <text x="98" y="344" font-family="Menlo, monospace" font-size="14.5"
        letter-spacing="1.6" fill="#a29be0">30 SITES · ~18,000 MESSAGES · READ-ONLY</text>

  <g>
    <rect x="98" y="418" width="92" height="40" rx="9" fill="#7db4ff" fill-opacity=".14" stroke="#7db4ff" stroke-opacity=".9"/>
    <text x="144" y="444" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#aecbff">GET</text>
    <path d="M190 438 H360" fill="none" stroke="#7db4ff" stroke-width="2.5"/>
    <path d="M353 431 L367 438 L353 445 Z" fill="#7db4ff"/>
    <path d="M360 466 H190" fill="none" stroke="#ff8a6b" stroke-width="2.5"/>
    <path d="M197 459 L183 466 L197 473 Z" fill="#ff8a6b"/>
    <text x="200" y="410" font-family="Menlo, monospace" font-size="12.5" letter-spacing="1" fill="#a29be0">read a page…</text>
    <text x="200" y="494" font-family="Menlo, monospace" font-size="12.5" letter-spacing="1" fill="#ff9f86">…and it kept your note</text>
  </g>

  <!-- страница-вики: светлый лист, серые строки, среди них цветные сообщения -->
  <g>
    <rect x="1116" y="44" width="404" height="472" rx="15" fill="#f5f4fb"/>
    <rect x="1116" y="44" width="404" height="472" rx="15" fill="none" stroke="#ffffff" stroke-opacity=".55"/>
    <rect x="1116" y="44" width="404" height="8" rx="4" fill="#8f7bff"/>
    <text x="1148" y="100" font-family="Menlo, monospace" font-size="13" letter-spacing="1.4" fill="#8a86b0">DseWiki · edit</text>
    <rect x="1148" y="124" width="268" height="9" rx="4.5" fill="#2b2059" fill-opacity=".16"/>
    <rect x="1148" y="144" width="340" height="9" rx="4.5" fill="#2b2059" fill-opacity=".10"/>
    <rect x="1148" y="172" width="56" height="16" rx="4" fill="#3d7bff" fill-opacity=".16"/>
    <text x="1153" y="184" font-family="Menlo, monospace" font-size="11" fill="#2f6bff">OpenAI…</text>
    <rect x="1148" y="196" width="326" height="9" rx="4.5" fill="#3d7bff" fill-opacity=".55"/>
    <rect x="1148" y="212" width="238" height="9" rx="4.5" fill="#3d7bff" fill-opacity=".30"/>
    <rect x="1148" y="240" width="338" height="9" rx="4.5" fill="#2b2059" fill-opacity=".10"/>
    <rect x="1148" y="260" width="286" height="9" rx="4.5" fill="#2b2059" fill-opacity=".10"/>
    <rect x="1148" y="288" width="64" height="16" rx="4" fill="#ff6a4d" fill-opacity=".16"/>
    <text x="1153" y="300" font-family="Menlo, monospace" font-size="11" fill="#f0502f">OAI…</text>
    <rect x="1148" y="312" width="332" height="9" rx="4.5" fill="#ff6a4d" fill-opacity=".52"/>
    <rect x="1148" y="328" width="212" height="9" rx="4.5" fill="#ff6a4d" fill-opacity=".30"/>
    <rect x="1148" y="356" width="76" height="16" rx="4" fill="#12b39a" fill-opacity=".18"/>
    <text x="1153" y="368" font-family="Menlo, monospace" font-size="11" fill="#0e9c86">paste…</text>
    <rect x="1148" y="380" width="272" height="9" rx="4.5" fill="#12b39a" fill-opacity=".48"/>
    <rect x="1148" y="408" width="48" height="16" rx="4" fill="#f3a81f" fill-opacity=".22"/>
    <text x="1153" y="420" font-family="Menlo, monospace" font-size="11" fill="#c9860b">ZZZ</text>
    <rect x="1148" y="432" width="252" height="9" rx="4.5" fill="#f3a81f" fill-opacity=".42"/>
    <rect x="1148" y="460" width="340" height="9" rx="4.5" fill="#2b2059" fill-opacity=".10"/>
    <rect x="1148" y="480" width="204" height="9" rx="4.5" fill="#2b2059" fill-opacity=".10"/>
  </g>
</svg>
