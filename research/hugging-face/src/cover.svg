<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Карточка раздела и соцсети. Композиция своя: линия времени доходит до точки
       расхождения и раздваивается на три версии — METR, OpenAI, Hugging Face,
       каждая своим цветом. Светлее и цветастее прежней почти-чёрной версии:
       живой сумеречный градиент с засветами, три источника — светлыми листами.
       Слова английские на всех языках. Шрифты системные: сайтовых в rsvg нет. -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20265e"/>
      <stop offset="52%" stop-color="#2b2059"/>
      <stop offset="100%" stop-color="#3a1d52"/>
    </linearGradient>
    <radialGradient id="glowV" cx="76%" cy="8%" r="58%">
      <stop offset="0%" stop-color="#8f7bff" stop-opacity=".52"/>
      <stop offset="100%" stop-color="#8f7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="2%" cy="54%" r="52%">
      <stop offset="0%" stop-color="#37e0c8" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#37e0c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="60%" cy="112%" r="56%">
      <stop offset="0%" stop-color="#ff67a8" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#ff67a8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowV)"/>
  <rect width="1200" height="630" fill="url(#glowT)"/>
  <rect width="1200" height="630" fill="url(#glowP)"/>

  <!-- линия времени и точки шагов -->
  <line x1="88" y1="96" x2="88" y2="330" stroke="#8f7bff" stroke-opacity=".6" stroke-width="2.5"/>
  <circle cx="88" cy="150" r="6" fill="#a29be0"/>
  <circle cx="88" cy="212" r="6" fill="#a29be0"/>
  <circle cx="88" cy="274" r="6" fill="#a29be0"/>

  <!-- точка расхождения и вилка на три версии -->
  <circle cx="88" cy="330" r="9" fill="#ff6a4d"/>
  <path d="M88 339V400" fill="none" stroke="#cfc9f2" stroke-width="2.5"/>
  <path d="M88 366H965V430" fill="none" stroke="#ff8a6b" stroke-width="2.5"/>
  <path d="M88 383H600V430" fill="none" stroke="#7db4ff" stroke-width="2.5"/>
  <path d="M88 400H235V430" fill="none" stroke="#ffcf5c" stroke-width="2.5"/>

  <!-- три карточки версий: светлые листы с цветной шапкой -->
  <g>
    <rect x="70" y="430" width="330" height="120" rx="12" fill="#f5f4fb"/>
    <rect x="70" y="430" width="330" height="6" rx="3" fill="#f3a81f"/>
    <text x="92" y="470" font-family="Menlo, monospace" font-size="15" letter-spacing="2.4" fill="#c9860b">METR</text>
    <rect x="92" y="488" width="240" height="9" rx="4.5" fill="#2b2059" fill-opacity=".18"/>
    <rect x="92" y="508" width="286" height="9" rx="4.5" fill="#2b2059" fill-opacity=".11"/>
    <rect x="92" y="528" width="180" height="9" rx="4.5" fill="#2b2059" fill-opacity=".11"/>
  </g>
  <g>
    <rect x="435" y="430" width="330" height="120" rx="12" fill="#f5f4fb"/>
    <rect x="435" y="430" width="330" height="6" rx="3" fill="#3d7bff"/>
    <text x="457" y="470" font-family="Menlo, monospace" font-size="15" letter-spacing="2.4" fill="#2f6bff">OPENAI</text>
    <rect x="457" y="488" width="200" height="9" rx="4.5" fill="#2b2059" fill-opacity=".18"/>
    <rect x="457" y="508" width="286" height="9" rx="4.5" fill="#2b2059" fill-opacity=".11"/>
    <rect x="457" y="528" width="150" height="9" rx="4.5" fill="#2b2059" fill-opacity=".11"/>
  </g>
  <g>
    <rect x="800" y="430" width="330" height="120" rx="12" fill="#f5f4fb"/>
    <rect x="800" y="430" width="330" height="6" rx="3" fill="#ff6a4d"/>
    <text x="822" y="470" font-family="Menlo, monospace" font-size="15" letter-spacing="2.4" fill="#f0502f">HUGGING FACE</text>
    <rect x="822" y="488" width="260" height="9" rx="4.5" fill="#2b2059" fill-opacity=".18"/>
    <rect x="822" y="508" width="200" height="9" rx="4.5" fill="#2b2059" fill-opacity=".11"/>
    <rect x="822" y="528" width="240" height="9" rx="4.5" fill="#2b2059" fill-opacity=".11"/>
  </g>

  <!-- заголовок -->
  <text x="140" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="62" letter-spacing="-1.6" fill="#f6f4ff">Three reports,</text>
  <text x="140" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="62" letter-spacing="-1.6" fill="#f6f4ff">one break-in</text>
  <text x="140" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#cfc9f2">The Hugging Face incident, July 2026</text>
  <text x="140" y="330" font-family="Menlo, monospace" font-size="15" letter-spacing="2" fill="#a29be0">32 STEPS · 3 SOURCES · 5 DISAGREEMENTS</text>

  <text x="70" y="596" font-family="Menlo, monospace" font-size="15" letter-spacing="1.6" fill="#a29be0">avgrebenkin.com/research</text>
</svg>
