<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <!-- Обложка для самой страницы: та же графика, что в cover.svg, но без единого
       слова текста. Карточка для соцсетей несёт вшитый английский заголовок, и на
       двенадцати переведённых страницах он оказался бы английским, да ещё
       продублировал бы <h1>. Названия трёх источников — имена собственные, они во
       всех языках одинаковы, поэтому остаются. -->
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#8b7cff" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" fill="#0b0c11"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- линия времени и точки шагов -->
  <line x1="88" y1="52" x2="88" y2="196" stroke="#8b7cff" stroke-opacity=".38" stroke-width="2"/>
  <circle cx="88" cy="90" r="6" fill="#6f7484"/>
  <circle cx="88" cy="126" r="6" fill="#6f7484"/>
  <circle cx="88" cy="162" r="6" fill="#6f7484"/>

  <!-- точка расхождения и вилка на три версии -->
  <circle cx="88" cy="196" r="9" fill="#f97362"/>
  <path d="M88 205V258" fill="none" stroke="#9298a8" stroke-width="2.5"/>
  <path d="M88 228H965V290" fill="none" stroke="#f97362" stroke-width="2.5"/>
  <path d="M88 243H600V290" fill="none" stroke="#6ea8fe" stroke-width="2.5"/>
  <path d="M88 258H235V290" fill="none" stroke="#e0a33e" stroke-width="2.5"/>

  <!-- три карточки версий -->
  <g>
    <rect x="70" y="290" width="330" height="108" fill="#12141c" stroke="#ffffff" stroke-opacity=".10"/>
    <rect x="70" y="290" width="330" height="4" fill="#e0a33e"/>
    <text x="92" y="324" font-family="Menlo, monospace" font-size="15" letter-spacing="2.4" fill="#e0a33e">METR</text>
    <rect x="92" y="344" width="240" height="9" fill="#ffffff" fill-opacity=".16"/>
    <rect x="92" y="363" width="286" height="9" fill="#ffffff" fill-opacity=".10"/>
    <rect x="92" y="382" width="180" height="9" fill="#ffffff" fill-opacity=".10"/>
  </g>
  <g>
    <rect x="435" y="290" width="330" height="108" fill="#12141c" stroke="#ffffff" stroke-opacity=".10"/>
    <rect x="435" y="290" width="330" height="4" fill="#6ea8fe"/>
    <text x="457" y="324" font-family="Menlo, monospace" font-size="15" letter-spacing="2.4" fill="#6ea8fe">OPENAI</text>
    <rect x="457" y="344" width="200" height="9" fill="#ffffff" fill-opacity=".16"/>
    <rect x="457" y="363" width="286" height="9" fill="#ffffff" fill-opacity=".10"/>
    <rect x="457" y="382" width="150" height="9" fill="#ffffff" fill-opacity=".10"/>
  </g>
  <g>
    <rect x="800" y="290" width="330" height="108" fill="#12141c" stroke="#ffffff" stroke-opacity=".10"/>
    <rect x="800" y="290" width="330" height="4" fill="#f97362"/>
    <text x="822" y="324" font-family="Menlo, monospace" font-size="15" letter-spacing="2.4" fill="#f97362">HUGGING FACE</text>
    <rect x="822" y="344" width="260" height="9" fill="#ffffff" fill-opacity=".16"/>
    <rect x="822" y="363" width="200" height="9" fill="#ffffff" fill-opacity=".10"/>
    <rect x="822" y="382" width="240" height="9" fill="#ffffff" fill-opacity=".10"/>
  </g>
</svg>
