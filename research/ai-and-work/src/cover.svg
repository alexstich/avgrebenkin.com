<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Обложка светлая: тёмные стоят у вики и (частично) у городов, здесь работает
       график. Композиция СВОЯ, не как у соседей: расходящийся столбчатый график
       занятости по возрастным группам — молодые вниз (красное), старшие вверх
       (зелёное). Все шесть значений взяты из данных (heroAlt): −3.0 −2.1 −1.6
       +1.3 +1.9 +0.4. Краски — токены светлой темы сайта. Шрифты системные. -->
  <defs>
    <linearGradient id="tint" x1="100%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#5b4fd6" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#5b4fd6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="warm" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff8f3a" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#ff8f3a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#f5f6f9"/>
  <rect width="1200" height="630" fill="url(#tint)"/>
  <rect width="1200" height="630" fill="url(#warm)"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="72" y="80" font-family="Menlo, monospace" font-size="19"
          letter-spacing="4" fill="#5b4fd6">RESEARCH · NO. 3</text>
    <text x="72" y="150" font-size="46" font-weight="700" fill="#14161f">Bill Gates’s job essay,</text>
    <text x="72" y="204" font-size="46" font-weight="700" fill="#14161f">checked against the data</text>
    <rect x="72" y="230" width="64" height="3" fill="#5b4fd6"/>

    <!-- расходящийся график: нулевая линия и шесть столбцов по возрасту -->
    <g>
      <!-- нулевая ось -->
      <line x1="104" y1="420" x2="986" y2="420" stroke="#14161f" stroke-opacity=".28" stroke-width="1.5"/>
      <text x="1000" y="425" font-family="Menlo, monospace" font-size="15" fill="#8a90a0">0%</text>

      <!-- 22–25 : −3.0 -->
      <rect x="102" y="420" width="96" height="96" rx="3" fill="#e0503f"/>
      <text x="150" y="552" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#5b6172">22–25</text>
      <text x="150" y="538" text-anchor="middle" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#a33a2e">−3.0</text>
      <!-- 26–30 : −2.1 -->
      <rect x="260" y="420" width="96" height="67" rx="3" fill="#e86a52"/>
      <text x="308" y="552" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#5b6172">26–30</text>
      <text x="308" y="509" text-anchor="middle" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#a33a2e">−2.1</text>
      <!-- 31–34 : −1.6 -->
      <rect x="418" y="420" width="96" height="51" rx="3" fill="#f0906f"/>
      <text x="466" y="552" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#5b6172">31–34</text>
      <text x="466" y="493" text-anchor="middle" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#a33a2e">−1.6</text>
      <!-- 35–40 : +1.3 -->
      <rect x="576" y="378" width="96" height="42" rx="3" fill="#4bae6a"/>
      <text x="624" y="552" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#5b6172">35–40</text>
      <text x="624" y="366" text-anchor="middle" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#15803d">+1.3</text>
      <!-- 41–49 : +1.9 -->
      <rect x="734" y="359" width="96" height="61" rx="3" fill="#229a4e"/>
      <text x="782" y="552" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#5b6172">41–49</text>
      <text x="782" y="347" text-anchor="middle" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#15803d">+1.9</text>
      <!-- 50+ : +0.4 -->
      <rect x="892" y="407" width="96" height="13" rx="3" fill="#7bc48f"/>
      <text x="940" y="552" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#5b6172">50+</text>
      <text x="940" y="395" text-anchor="middle" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#15803d">+0.4</text>
    </g>

    <text x="72" y="596" font-size="20" font-weight="600" fill="#14161f">Same occupations, different age.<tspan dx="14" font-weight="400" fill="#5b6172">Stanford Digital Economy Lab</tspan></text>
    <text x="1128" y="596" text-anchor="end" font-family="Menlo, monospace" font-size="16"
          letter-spacing="1" fill="#8a90a0">avgrebenkin.com/research</text>
  </g>
</svg>
