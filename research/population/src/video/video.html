<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Population video frames</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block">
<style>html, body { margin: 0; background: #070a12; } canvas { display: block; max-width: 100vw; max-height: 100vh; }</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
/* Кадры ролика для соцсетей: тот же датасет (../data.json), что и страница, та
   же геометрическая интерполяция между узлами, тот же темп «равные удвоения».
   render.py открывает страницу в headless Chromium и просит кадр за кадром:
   frame(i) рисует i-й кадр и отдаёт PNG. Никакого реального времени — поэтому
   ролик выходит ровным, сколько бы ни занимал один кадр.

   ?lang=en|ru  &w=1080&h=1350  &fps=30 */
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  var LANG = Q.get('lang') || 'en', W = +Q.get('w') || 1080, H = +Q.get('h') || 1350, FPS = +Q.get('fps') || 30;
  var WIDE = W > H;
  var T_IN = 1.6, T_RUN = 24, T_HOLD = 4.4, TOTAL = T_IN + T_RUN + T_HOLD;
  var D2R = Math.PI / 180;

  var PR = new Intl.PluralRules(LANG);
  var NF = new Intl.NumberFormat(LANG);
  var S = {
    en: {
      title: 'Eight billion, one doubling at a time',
      sub: 'World population, 10,000 BCE → 2023 · one dot = one million people',
      each: 'How long each doubling took',
      unit: function (big) { return big ? 'billion people' : 'million people'; },
      yrs: function (n) { return NF.format(n) + (n === 1 ? ' year' : ' years'); },
      more: function (n) { return NF.format(n) + ' years and counting'; },
      year: function (y) { return y < 0 ? NF.format(-y) + ' BCE' : y === 0 ? '1 CE' : y < 1000 ? y + ' CE' : String(y); },
      via: 'via Our World in Data',
      url: 'avgrebenkin.com/research/population'
    },
    ru: {
      title: 'Восемь миллиардов: удвоение за удвоением',
      sub: 'Население мира, 10 000 до н. э. → 2023 · точка = миллион человек',
      each: 'Сколько длилось каждое удвоение',
      /* число всегда дробное (19,2; 8,09), а после дроби — родительный единственного */
      unit: function (big) { return big ? 'миллиарда человек' : 'миллиона человек'; },
      yrs: function (n) { return NF.format(n) + ' ' + ({ one: 'год', few: 'года' }[PR.select(n)] || 'лет'); },
      more: function (n) { return NF.format(n) + ' ' + ({ one: 'год', few: 'года' }[PR.select(n)] || 'лет') + ' и дальше'; },
      year: function (y) { return y < 0 ? NF.format(-y) + ' до н. э.' : y === 0 ? '1 г. н. э.' : y < 1000 ? y + ' г. н. э.' : String(y); },
      via: 'в обработке Our World in Data',
      url: 'avgrebenkin.com/research/population/ru'
    }
  }[LANG];
  var NF_SHORT = new Intl.NumberFormat(LANG, { notation: 'compact', compactDisplay: 'short', maximumSignificantDigits: 3 });
  function dec(v, d) { return new Intl.NumberFormat(LANG, { minimumFractionDigits: d, maximumFractionDigits: d }).format(v); }

  var C = {
    bg: '#070a12', s1: '#17233d', s2: '#080d1a', land: 'rgba(120,150,215,.10)', line: 'rgba(150,175,235,.22)',
    grat: 'rgba(150,175,235,.07)', dot: '#ffd76a', acc: '#ffb020', teal: '#17c0a6', ink: '#f3f5fa', mute: '#8d97ad',
    hyde: '#ff5da2', gap: '#17c0a6', un: '#2f7de0'
  };
  var HEAD = '"Space Grotesk", system-ui, sans-serif', BODY = 'Inter, system-ui, sans-serif', MONO = '"JetBrains Mono", ui-monospace, monospace';

  var cv = document.getElementById('cv'); cv.width = W; cv.height = H;
  var g = cv.getContext('2d');

  /* ── раскладка: вертикаль 4:5 или горизонталь 16:9 ─────────────── */
  /* в горизонтали глобус слева, всё остальное — колонкой справа */
  var L = WIDE ? {
    cx: W * 0.29, cy: H * 0.52, R: H * 0.38, textW: W * 0.40,
    tx: W * 0.555, titleY: H * 0.14, subY: H * 0.14 + 46, titleSize: 50, align: 'left',
    numX: W * 0.555, numY: H * 0.30, numSize: 150,
    rowsX: W * 0.555, rowsY: H * 0.575, rowH: 26, barMax: W * 0.17, popW: 104,
    footY: H * 0.915, urlY: H * 0.955
  } : {
    cx: W / 2, cy: H * 0.415, R: W * 0.325, textW: W - 96,
    tx: W / 2, titleY: 86, subY: 130, titleSize: Math.round(W * 0.042), align: 'center',
    numX: W / 2, numY: H * 0.415, numSize: W * 0.125,
    rowsX: 64, rowsY: H * 0.735, rowH: 22.5, barMax: W * 0.50, popW: 150,
    footY: H - 72, urlY: H - 36
  };

  var P, Y, N, CODES, GEO = {}, DOTS = {}, STARS = [], SPRITE, DBL = [], MAP;

  function seek(year) {
    if (year <= Y[0]) return [0, 0, 0];
    if (year >= Y[N - 1]) return [N - 1, N - 1, 0];
    var lo = 0, hi = N - 1;
    while (hi - lo > 1) { var m = (lo + hi) >> 1; if (Y[m] <= year) lo = m; else hi = m; }
    return [lo, hi, (year - Y[lo]) / (Y[hi] - Y[lo])];
  }
  function interp(arr, year) {
    var s = seek(year), a = arr[s[0]], b = arr[s[1]], f = s[2];
    if (s[0] === s[1]) return a;
    return (a > 0 && b > 0) ? a * Math.pow(b / a, f) : a + (b - a) * f;
  }
  function worldAt(y) { return interp(P.world, y); }
  function popAt(c, y) { return interp(P.pop[c], y); }
  function source(y) { return y < 1800 ? 0 : y < 1950 ? 1 : 2; }

  function xyz(lon, lat) {
    var a = lon * D2R, b = lat * D2R, cb = Math.cos(b);
    return [cb * Math.sin(a), Math.sin(b), cb * Math.cos(a)];
  }
  function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function prepare(data) {
    P = data; Y = P.years; N = Y.length; CODES = Object.keys(P.pop);
    Object.keys(P.shapes).forEach(function (c) {
      GEO[c] = P.shapes[c].map(function (poly) {
        return poly.map(function (ring) { var o = []; for (var k = 0; k < ring.length; k += 2) o.push.apply(o, xyz(ring[k], ring[k + 1])); return o; });
      });
    });
    CODES.forEach(function (c) {
      var d = P.dots[c] || [], o = new Float32Array(d.length / 2 * 3);
      for (var k = 0; k < d.length; k += 2) { var v = xyz(d[k], d[k + 1]); o.set(v, k / 2 * 3); }
      DOTS[c] = o;
    });
    var rnd = mulberry(11);
    for (var i = 0; i < (WIDE ? 520 : 440); i++) STARS.push([rnd() * W, rnd() * H, 0.35 + rnd() * 1.1, 0.15 + rnd() * 0.55, rnd() * 6.28, 0.4 + rnd() * 1.2]);

    /* точка со свечением: рисуется одним drawImage, складывается режимом lighter */
    var r = L.R / 50; SPRITE = document.createElement('canvas'); SPRITE.width = SPRITE.height = Math.ceil(r * 2);
    var sg = SPRITE.getContext('2d'), gr = sg.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, 'rgba(255,240,200,1)'); gr.addColorStop(0.16, 'rgba(255,215,106,.95)');
    gr.addColorStop(0.34, 'rgba(255,176,32,.28)'); gr.addColorStop(1, 'rgba(255,150,20,0)');
    sg.fillStyle = gr; sg.fillRect(0, 0, r * 2, r * 2);

    /* темп «равные удвоения»: доля пути — логарифм достигнутого максимума
       населения (спад после Чёрной смерти не отматывает время назад) плюс
       десятая доля равномерных лет, чтобы плато не проскакивали мгновенно */
    var y0 = Y[0], y1 = Y[N - 1], m = 0, tab = [], l0 = Math.log(worldAt(y0)), l1 = Math.log(worldAt(y1));
    for (var y = y0; y <= y1; y++) { m = Math.max(m, worldAt(y)); tab.push(0.9 * (Math.log(m) - l0) / (l1 - l0) + 0.1 * (y - y0) / (y1 - y0)); }
    MAP = function (u) {
      var lo = 0, hi = tab.length - 1;
      if (u <= 0) return y0; if (u >= 1) return y1;
      while (hi - lo > 1) { var k = (lo + hi) >> 1; if (tab[k] <= u) lo = k; else hi = k; }
      return y0 + lo + (u - tab[lo]) / (tab[hi] - tab[lo]);
    };
    /* удвоения от населения 10 000 до н. э.: когда ряд впервые дошёл до P0·2^k */
    var p0 = worldAt(y0), k = 1, prev = y0; m = 0;
    for (y = y0; y <= y1; y += 0.25) {
      m = Math.max(m, worldAt(y));
      if (m >= p0 * Math.pow(2, k)) { DBL.push({ from: prev, to: y, pop: p0 * Math.pow(2, k) }); prev = y; k++; }
    }
    DBL.max = Math.max.apply(null, DBL.map(function (d) { return d.to - d.from; }));
    DBL.push({ from: prev, to: Infinity, pop: 0 });   /* удвоение, которое идёт сейчас */
  }

  /* ── глобус ────────────────────────────────────────────────────── */
  var rot = {};
  function setRot(lon0, lat0) { rot.cl = Math.cos(lon0 * D2R); rot.sl = Math.sin(lon0 * D2R); rot.cf = Math.cos(lat0 * D2R); rot.sf = Math.sin(lat0 * D2R); }
  var OUT = [0, 0, 0];
  function proj(x, y, z, R, cx, cy) {
    var x1 = x * rot.cl - z * rot.sl, z1 = x * rot.sl + z * rot.cl;
    var y2 = y * rot.cf - z1 * rot.sf, z2 = y * rot.sf + z1 * rot.cf;
    OUT[0] = cx + R * x1; OUT[1] = cy - R * y2; OUT[2] = z2;
  }
  function ringPath(f, R, cx, cy) {
    var n = f.length / 3, vis = false, j;
    for (j = 0; j < n; j++) { proj(f[3 * j], f[3 * j + 1], f[3 * j + 2], R, cx, cy); if (OUT[2] > 0) { vis = true; break; } }
    if (!vis) return false;
    for (j = 0; j < n; j++) {
      proj(f[3 * j], f[3 * j + 1], f[3 * j + 2], R, cx, cy);
      var x = OUT[0], y = OUT[1];
      /* невидимая точка прижимается к краю диска, чтобы заливка не рвалась */
      if (OUT[2] < 0) { var dx = x - cx, dy = y - cy, l = Math.sqrt(dx * dx + dy * dy) || 1; x = cx + dx / l * R; y = cy + dy / l * R; }
      if (j) g.lineTo(x, y); else g.moveTo(x, y);
    }
    g.closePath();
    return true;
  }
  function graticule(R, cx, cy) {
    g.strokeStyle = C.grat; g.lineWidth = 1; g.beginPath();
    var lon, lat, v, on;
    for (lon = -180; lon < 180; lon += 30) {
      on = false;
      for (lat = -90; lat <= 90; lat += 3) { v = xyz(lon, lat); proj(v[0], v[1], v[2], R, cx, cy); if (OUT[2] > 0) { if (on) g.lineTo(OUT[0], OUT[1]); else g.moveTo(OUT[0], OUT[1]); on = true; } else on = false; }
    }
    for (lat = -60; lat <= 60; lat += 30) {
      on = false;
      for (lon = -180; lon <= 180; lon += 3) { v = xyz(lon, lat); proj(v[0], v[1], v[2], R, cx, cy); if (OUT[2] > 0) { if (on) g.lineTo(OUT[0], OUT[1]); else g.moveTo(OUT[0], OUT[1]); on = true; } else on = false; }
    }
    g.stroke();
  }

  function globe(y, t, fade) {
    var R = L.R * (0.965 + 0.035 * fade), cx = L.cx, cy = L.cy;
    /* медленный поворот от Африки и Плодородного полумесяца к Индии и Китаю:
       глобус всё время смотрит туда, где живёт большинство людей */
    setRot(-12 + 102 * ease(t / TOTAL * 0.9 + 0.05), 16);
    g.globalAlpha = fade;
    var halo = g.createRadialGradient(cx, cy, R * 0.96, cx, cy, R * 1.22);
    halo.addColorStop(0, 'rgba(80,130,255,.20)'); halo.addColorStop(1, 'rgba(80,130,255,0)');
    g.fillStyle = halo; g.beginPath(); g.arc(cx, cy, R * 1.22, 0, 7); g.fill();
    var sp = g.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R);
    sp.addColorStop(0, C.s1); sp.addColorStop(1, C.s2);
    g.fillStyle = sp; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill();
    graticule(R, cx, cy);

    g.lineWidth = Math.max(0.8, W / 1400); g.lineJoin = 'round';
    Object.keys(GEO).forEach(function (c) {
      g.beginPath(); var any = false;
      GEO[c].forEach(function (poly) { poly.forEach(function (ring) { if (ringPath(ring, R, cx, cy)) any = true; }); });
      if (!any) return;
      /* подсветка плотности: чем больше людей на км², тем теплее суша */
      var dens = P.pop[c] ? popAt(c, y) / P.names[c][3] : 0, a = dens > 0 ? Math.max(0, Math.min(1, (Math.log10(dens) + 2) / 4.5)) : 0;
      g.fillStyle = C.land; g.fill('evenodd');
      if (a > 0) { g.fillStyle = 'rgba(255,150,40,' + (a * a * 0.26).toFixed(3) + ')'; g.fill('evenodd'); }
      g.strokeStyle = C.line; g.stroke();
    });

    g.globalCompositeOperation = 'lighter';
    var sz = L.R / 50 * 2 * 0.62, h = sz / 2;
    CODES.forEach(function (c) {
      var d = DOTS[c], n = popAt(c, y) / 1e6, m = Math.min(Math.ceil(n), d.length / 3), full = Math.floor(n);
      for (var k = 0; k < m; k++) {
        proj(d[3 * k], d[3 * k + 1], d[3 * k + 2], R, cx, cy);
        if (OUT[2] <= 0) continue;
        var a = (k < full ? 1 : n - full) * Math.min(1, OUT[2] * 4) * fade;
        if (a < 0.02) continue;
        g.globalAlpha = a; g.drawImage(SPRITE, OUT[0] - h, OUT[1] - h, sz, sz);
      }
    });
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = fade;
    var rim = g.createRadialGradient(cx, cy, R * 0.82, cx, cy, R);
    rim.addColorStop(0, 'rgba(7,10,18,0)'); rim.addColorStop(1, 'rgba(7,10,18,.45)');
    g.fillStyle = rim; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill();
    g.strokeStyle = 'rgba(150,175,235,.28)'; g.lineWidth = 1.5; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke();
    g.globalAlpha = 1;
  }

  /* ── текст ─────────────────────────────────────────────────────── */
  function text(s, x, y, font, color, align, spacing) {
    g.font = font; g.fillStyle = color; g.textAlign = align || 'left'; g.textBaseline = 'alphabetic';
    if (spacing) g.letterSpacing = spacing + 'px';
    g.fillText(s, x, y);
    g.letterSpacing = '0px';
  }
  /* русский заголовок длиннее английского: кегль уменьшается, пока строка не влезет */
  function fit(weight, size, family, s, maxW) {
    for (; size > 12; size--) { g.font = weight + ' ' + size + 'px ' + family; if (g.measureText(s).width <= maxW) break; }
    return weight + ' ' + size + 'px ' + family;
  }
  function counter(y, a) {
    var w = worldAt(y), big = w >= 1e9, v = w / (big ? 1e9 : 1e6), d = v < 10 ? 2 : 1;
    var x = L.numX, cy = L.numY;
    if (!WIDE) {
      /* тёмное пятно под числом, вытянутое вбок: подпись единиц шире самого числа */
      var hr = L.R * 0.72, hl = g.createRadialGradient(0, 0, 0, 0, 0, hr);
      hl.addColorStop(0, 'rgba(7,10,18,.84)'); hl.addColorStop(0.62, 'rgba(7,10,18,.62)'); hl.addColorStop(1, 'rgba(7,10,18,0)');
      g.save(); g.translate(x, cy + L.numSize * 0.35); g.scale(1.32, 1);
      g.globalAlpha = a; g.fillStyle = hl; g.beginPath(); g.arc(0, 0, hr, 0, 7); g.fill(); g.restore();
    }
    g.globalAlpha = a;
    var sz = L.numSize, base = cy + sz * 0.28;
    text(dec(v, d), x, base, '700 ' + sz + 'px ' + HEAD, C.ink, L.align, -2);
    var ub = base + sz * 0.35;   /* ниже хвоста запятой в «8,09» */
    text(S.unit(big).toUpperCase(), x + (L.align === 'left' ? 4 : 0), ub, '500 ' + Math.round(sz * 0.19) + 'px ' + MONO, C.mute, L.align, 5);
    text(S.year(Math.round(y)), x, ub + sz * 0.46, '600 ' + Math.round(sz * 0.36) + 'px ' + HEAD, C.acc, L.align);
    g.globalAlpha = 1;
  }
  function rows(y, a) {
    g.globalAlpha = a;
    text(S.each.toUpperCase(), L.rowsX, L.rowsY - 22, '500 ' + (WIDE ? 17 : 18) + 'px ' + MONO, C.mute, 'left', 3);
    var bx = L.rowsX + L.popW + 18, rh = L.rowH, bh = Math.round(rh * 0.42);
    var list = DBL.filter(function (d) { return d.from <= y; });
    list.forEach(function (d, i) {
      var done = d.to <= y, span = (done ? d.to : y) - d.from, ry = L.rowsY + i * rh;
      var len = Math.max(bh, span / DBL.max * L.barMax), fresh = Math.min(1, (y - d.from) / 40 + 0.35);
      g.globalAlpha = a * fresh;
      text(done ? NF_SHORT.format(d.pop) : '…', L.rowsX + L.popW, ry + bh * 0.5 + 6, '500 ' + (WIDE ? 17 : 18) + 'px ' + MONO, done ? C.ink : C.mute, 'right');
      /* тёплый ряд: от старых удвоений к новым цвет теплеет */
      var hue = 40 - i * 3.2, col = 'hsl(' + hue + ', 95%, ' + (done ? 58 : 45) + '%)';
      g.fillStyle = col; g.beginPath(); g.roundRect(bx, ry, len, bh, bh / 2); g.fill();
      text(done ? S.yrs(Math.round(span)) : S.more(Math.round(span)), bx + len + 14, ry + bh * 0.5 + 6, '500 ' + (WIDE ? 18 : 19) + 'px ' + BODY, done ? C.ink : C.acc, 'left');
    });
    g.globalAlpha = 1;
  }
  function footer(y, a, end) {
    g.globalAlpha = a;
    var names = ['HYDE 3.3', 'Gapminder v7', 'UN WPP 2024'], cols = [C.hyde, C.gap, C.un], on = source(y), x = L.rowsX, fy = L.footY;
    g.font = '500 17px ' + MONO;
    names.forEach(function (n, i) {
      var active = i === on, w = g.measureText(n).width;
      g.fillStyle = active ? cols[i] : 'rgba(141,151,173,.35)'; g.beginPath(); g.arc(x + 6, fy - 6, 5, 0, 7); g.fill();
      text(n, x + 18, fy, '500 17px ' + MONO, active ? C.ink : 'rgba(141,151,173,.55)', 'left');
      x += 18 + w + 26;
    });
    text(S.via, x, fy, '400 17px ' + MONO, C.mute, 'left');
    g.globalAlpha = a * (0.55 + 0.45 * end);
    text(S.url, L.rowsX, L.urlY, '500 ' + (WIDE ? 20 : 19) + 'px ' + MONO, end > 0.5 ? C.teal : C.mute, 'left', 1);
    g.globalAlpha = 1;
  }

  function ease(x) { return x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x); }

  function draw(t) {
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
    var bg = g.createRadialGradient(L.cx, L.cy, 0, L.cx, L.cy, Math.max(W, H) * 0.8);
    bg.addColorStop(0, 'rgba(23,35,61,.55)'); bg.addColorStop(1, 'rgba(7,10,18,0)');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    STARS.forEach(function (s) {
      g.globalAlpha = s[3] * (0.75 + 0.25 * Math.sin(t * s[5] + s[4]));
      g.fillStyle = '#fff'; g.beginPath(); g.arc(s[0], s[1], s[2], 0, 7); g.fill();
    });
    g.globalAlpha = 1;

    var fadeIn = ease(t / 1.1);
    var r = (t - T_IN) / T_RUN, rc = Math.max(0, Math.min(1, r));
    /* лёгкое торможение к финишу: последние десятилетия садятся мягко */
    var u = 0.55 * rc + 0.45 * (1 - Math.pow(1 - rc, 2));
    var y = MAP(u);
    globe(y, t, fadeIn);

    g.globalAlpha = fadeIn;
    text(S.title, L.tx, L.titleY, fit('600', L.titleSize, HEAD, S.title, L.textW), C.ink, L.align, -0.5);
    text(S.sub, L.tx, L.subY, fit('400', WIDE ? 20 : Math.round(W * 0.0175), MONO, S.sub, L.textW), C.mute, L.align);
    g.globalAlpha = 1;
    counter(y, fadeIn);
    rows(y, ease((t - 0.6) / 1));
    footer(y, fadeIn, ease((t - T_IN - T_RUN - 0.4) / 0.8));
  }

  window.FRAMES = Math.round(TOTAL * FPS);
  window.frame = function (i) { draw(i / FPS); return cv.toDataURL('image/png'); };
  window.at = function (t) { draw(t); return cv.toDataURL('image/png'); };
  fetch('../data.json').then(function (r) { return r.json(); }).then(function (d) {
    prepare(d);
    return document.fonts.ready;
  }).then(function () {
    return Promise.all(['600 40px "Space Grotesk"', '700 40px "Space Grotesk"', '500 20px "JetBrains Mono"', '400 20px "JetBrains Mono"', '500 20px Inter'].map(function (f) { return document.fonts.load(f, LANG === 'ru' ? 'Мир' : 'World'); }));
  }).then(function () { draw(T_IN + T_RUN + T_HOLD); window.READY = true; });
})();
</script>
