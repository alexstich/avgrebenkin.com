  <!-- Обложка городов: глобус без слов (карточка и шапка — одна картинка, а
       шапка по правилу без текста). Нарисован заново и цветным — прежний был
       тёмно-фиолетовым и почти сливался с обложкой вики. Точки-города разбросаны
       проекцией на сферу и раскрашены по баллу: от прохладно-синего к тёплому
       золоту, крупнее и ярче — те, что выше. Композиция своя. -->
